# Checks every push and pull request; deploys main to GitHub Pages.
# Deploying is skipped while the repository is private (Pages on the free
# plan needs a public repo), so it starts once the repo is made public.
# Actions are pinned to commit SHAs (Dependabot keeps them current).
#
# Release freeze: set the repository variable DEPLOY_FROZEN to "true"
# (gh variable set DEPLOY_FROZEN --body true) and pushes to main only run the
# checks. A manual run (Actions → Run workflow, or gh workflow run) still
# deploys. Lift it with gh variable delete DEPLOY_FROZEN.
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private && (vars.DEPLOY_FROZEN != 'true' || github.event_name == 'workflow_dispatch')
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private && (vars.DEPLOY_FROZEN != 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
