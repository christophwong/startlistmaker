<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content-Security-Policy meta, added at build time only (vite.config.ts) so dev HMR styles work. -->
    %CSP%
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Build freediving competition start lists from your Google Forms export. Runs entirely in your browser; athlete data is never uploaded or shared." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://startlistmaker.online/" />
    <title>Start List Maker · Freediving start lists</title>
    <!-- Link previews in chat apps and email. Absolute URLs: crawlers don't resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Start List Maker" />
    <meta property="og:title" content="Start List Maker · Freediving start lists" />
    <meta property="og:description" content="Build start lists for AIDA world apnea competitions from your Google Forms export, right in your browser. Athlete data is never uploaded or shared." />
    <meta property="og:url" content="https://startlistmaker.online/" />
    <meta property="og:image" content="https://startlistmaker.online/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Start List Maker: freediving start lists from your Google Forms export." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Start List Maker builds start lists in your browser with JavaScript, so athlete data is never uploaded. Please enable
      JavaScript to use it.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
